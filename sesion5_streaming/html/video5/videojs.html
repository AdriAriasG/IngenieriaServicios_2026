<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de Video.js</title>
  <!-- estilos de video.js desde su cdn -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
  <h1>Big Buck Bunny con Video.js</h1>
  <!-- la etiqueta video normal, con la clase video-js para que la maneje el reproductor -->
  <video
    id="mi-reproductor"
    class="video-js vjs-default-skin vjs-big-play-centered"
    controls
    preload="auto"
    width="640"
    height="360"
    poster="big-buck-bunny-poster.png"
    data-setup='{}'
  >
    <!-- mismas fuentes que en index.html -->
    <source src="big_buck_bunny.mp4" type="video/mp4" />
    <source src="big_buck_bunny.webm" type="video/webm" />
    <source src="big_buck_bunny.ogv" type="video/ogg" />
    <p class="vjs-no-js">
      Para ver este vídeo, activa JavaScript en tu navegador.
    </p>
  </video>

  <!-- script principal de video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
</body>
</html>

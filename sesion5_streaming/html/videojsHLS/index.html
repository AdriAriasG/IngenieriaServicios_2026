<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Apple HLS con Video.js</title>
  <link href="https://vjs.zencdn.net/7.1.0/video-js.css" rel="stylesheet">
</head>
<body>
  <h1>HLS con Video.js</h1>
  <video id="my-video" class="video-js" controls
        preload="auto" width="640" height="360">
    <!-- url hls de la aplicacion videodemanda de wowza (ip de la maquina ubuntu, no la del contenedor) -->
    <source src="http://192.168.207.224:1935/videodemanda/mp4:sample.mp4/playlist.m3u8" type="application/x-mpegURL">
    <p class="vjs-no-js">
        Para ver este video debes activar JavaScript y tener un navegador
        moderno que <a href="https://videojs.com/html5-video-support/">
        soporte HTML5 video</a>
    </p>
  </video>
  <script src="https://vjs.zencdn.net/7.1.0/video.js"></script>
  <script>
    // creo el reproductor sobre el elemento video con ese id
    var player = videojs('my-video')
  </script>
</body>
</html>
